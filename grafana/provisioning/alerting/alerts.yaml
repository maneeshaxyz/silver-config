apiVersion: 1
groups:
  - orgId: 1
    name: Sev0
    folder: Vitals Alerts
    interval: 2m
    rules:
      - uid: af7jwbs8xrtogd
        title: CPU-Critical
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode='idle'}[5m])) * 100)
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 90
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        dashboardUid: ""
        panelId: 0
        noDataState: NoData
        execErrState: Error
        for: 2m
        annotations:
          description: CPU goes over 90% for more than 5 mins.
          summary: CPU usage over 90%
        labels:
          component: cpu
          severity: critical
        isPaused: false
        notification_settings:
          receiver: googlechat-contact-point
      - uid: ff7jxfqyqvuv4c
