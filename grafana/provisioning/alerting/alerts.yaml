              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        dashboardUid: ""
        panelId: 0
        noDataState: NoData
        execErrState: Error
        for: 2m
        annotations:
          description: RAM goes over 90% for more than 5 mins.
          summary: RAM usage over 90%
        labels:
          component: memory
          severity: critical
